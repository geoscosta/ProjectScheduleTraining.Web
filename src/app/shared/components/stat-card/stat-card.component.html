<div
  class="bg-white rounded-xl border border-surface-200 p-5 cursor-pointer hover:shadow-card-hover transition-all duration-200"
  [routerLink]="routerLink">

  <div class="flex items-start justify-between">
    <div class="flex-1 min-w-0">
      <p class="text-xs font-medium text-slate-500 uppercase tracking-wide truncate">
        {{ title }}
      </p>
      <p class="text-3xl font-bold mt-2" [class]="getValueClass()">
        {{ value }}
      </p>
    </div>
    <div class="w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0 ml-3"
      [class]="getIconContainerClass()">
      <mat-icon [class]="getIconClass()">{{ icon }}</mat-icon>
    </div>
  </div>

</div>
