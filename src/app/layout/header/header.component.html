<header class="h-16 bg-white border-b border-surface-200 flex items-center px-4 gap-4 sticky top-0 z-10">

  <!-- Toggle sidebar -->
  <button mat-icon-button (click)="onToggleSidebar()" class="text-slate-500 hover:text-slate-700">
    <mat-icon>menu</mat-icon>
  </button>

  <!-- Breadcrumb / título -->
  <div class="flex-1 min-w-0">
    <h1 class="text-base font-semibold text-slate-800 truncate">
      Project Schedule Training
    </h1>
  </div>

  <!-- Ações direita -->
  <div class="flex items-center gap-2">

    <!-- Avatar + menu -->
    <button mat-button [matMenuTriggerFor]="userMenu"
      class="flex items-center gap-2 px-3 py-1.5 rounded-lg hover:bg-surface-100 transition-colors">
      <div class="w-8 h-8 rounded-full bg-primary-600 flex items-center justify-center">
        <span class="text-white text-xs font-semibold">
          {{ currentUser?.name?.charAt(0)?.toUpperCase() }}
        </span>
      </div>
      <div class="hidden sm:block text-left">
        <p class="text-sm font-medium text-slate-700 leading-tight">{{ currentUser?.name }}</p>
        <p class="text-xs text-slate-400 leading-tight">{{ getRoleLabel() }}</p>
      </div>
      <mat-icon class="text-slate-400 text-sm">expand_more</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu" xPosition="before">
      <div class="px-4 py-3 border-b border-surface-200">
        <p class="text-sm font-semibold text-slate-700">{{ currentUser?.name }}</p>
        <p class="text-xs text-slate-400">{{ currentUser?.email }}</p>
      </div>
      <button mat-menu-item routerLink="/profile">
        <mat-icon class="text-slate-500">manage_accounts</mat-icon>
        <span>Meu Perfil</span>
      </button>
      <button mat-menu-item (click)="onLogout()" class="text-red-600">
        <mat-icon class="text-red-500">logout</mat-icon>
        <span>Sair</span>
      </button>
    </mat-menu>

  </div>
</header>
