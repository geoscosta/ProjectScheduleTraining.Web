<aside
  class="flex flex-col bg-slate-900 h-full transition-all duration-300 ease-in-out overflow-hidden"
  [style.width]="isOpen ? '256px' : '0px'">

  <div class="flex flex-col h-full w-64">

    <!-- Logo -->
    <div class="flex items-center gap-3 h-16 px-5 border-b border-slate-700/50 flex-shrink-0">
      <div class="w-8 h-8 rounded-lg bg-primary-600 flex items-center justify-center flex-shrink-0">
        <mat-icon class="text-white text-lg">fitness_center</mat-icon>
      </div>
      <div class="min-w-0">
        <p class="text-white font-semibold text-sm leading-tight">PST Studio</p>
        <p class="text-slate-400 text-xs leading-tight">Gestão</p>
      </div>
    </div>

    <!-- Menu -->
    <nav class="flex-1 px-3 py-4 space-y-0.5 overflow-y-auto">
      @for (item of menuItems; track item.route) {
        @if (canShow(item)) {
          <div
            [routerLink]="item.route"
            routerLinkActive="bg-slate-700 text-white"
            [routerLinkActiveOptions]="{exact: item.route === '/dashboard'}"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-all duration-150 cursor-pointer">
            <mat-icon class="text-lg flex-shrink-0">{{ item.icon }}</mat-icon>
            <span class="text-sm font-medium whitespace-nowrap">{{ item.label }}</span>
          </div>
        }
      }
    </nav>

    <!-- Footer -->
    <div class="px-3 py-4 border-t border-slate-700/50 flex-shrink-0">
      <div class="flex items-center gap-3 px-3 py-2">
        <div class="w-7 h-7 rounded-full bg-primary-600 flex items-center justify-center flex-shrink-0">
          <span class="text-white text-xs font-semibold">
            {{ currentUser?.name?.charAt(0)?.toUpperCase() }}
          </span>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-white truncate">{{ currentUser?.name }}</p>
          <p class="text-xs text-slate-400 truncate">{{ currentUser?.email }}</p>
        </div>
      </div>
    </div>

  </div>
</aside>
