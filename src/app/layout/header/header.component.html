<mat-toolbar class="bg-white shadow-sm border-b border-gray-200">

  <!-- Botão toggle sidebar -->
  <button mat-icon-button (click)="onToggleSidebar()" class="mr-4">
    <mat-icon>menu</mat-icon>
  </button>

  <!-- Título -->
  <span class="text-lg font-semibold text-gray-800">
    Project Schedule Training
  </span>

  <span class="flex-1"></span>

  <!-- Menu do usuário -->
  <button mat-button [matMenuTriggerFor]="userMenu" class="flex items-center gap-2">
    <mat-icon>account_circle</mat-icon>
    <span class="text-sm">{{ currentUser?.name }}</span>
    <mat-icon>arrow_drop_down</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu">
    <button mat-menu-item (click)="onProfile()">
      <mat-icon>person</mat-icon>
      <span>Perfil</span>
    </button>
    <mat-divider />
    <button mat-menu-item (click)="onLogout()">
      <mat-icon>logout</mat-icon>
      <span>Sair</span>
    </button>
  </mat-menu>

</mat-toolbar>
