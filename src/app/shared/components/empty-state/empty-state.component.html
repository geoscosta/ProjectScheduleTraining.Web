<div class="flex flex-col items-center justify-center py-16 px-4">
  <div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center mb-4">
    <mat-icon class="text-3xl text-slate-300">{{ icon }}</mat-icon>
  </div>
  <p class="text-sm text-slate-400 text-center">{{ message }}</p>
  @if (actionLabel && actionRoute) {
    <button mat-stroked-button color="primary" [routerLink]="actionRoute" class="mt-4">
      {{ actionLabel }}
    </button>
  }
</div>
