<aside
  class="bg-gray-900 text-white transition-all duration-300 flex flex-col"
  [class.w-64]="isOpen"
  [class.w-0]="!isOpen"
  [class.overflow-hidden]="!isOpen">

  <!-- Logo -->
  <div class="flex items-center justify-center h-16 border-b border-gray-700 px-4">
    <span class="text-lg font-bold text-white whitespace-nowrap">
      PST Studio
    </span>
  </div>

  <!-- Menu -->
  <nav class="flex-1 px-2 py-4 space-y-1 overflow-y-auto">
    @for (item of menuItems; track item.route) {
      @if (canShow(item)) {
        <div
          [routerLink]="item.route"
          routerLinkActive="bg-blue-600"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition-colors duration-200 whitespace-nowrap cursor-pointer">
          <mat-icon class="text-xl">{{ item.icon }}</mat-icon>
          <span class="text-sm font-medium">{{ item.label }}</span>
        </div>
      }
    }
  </nav>

  <!-- Versão -->
  <div class="px-4 py-3 border-t border-gray-700">
    <span class="text-xs text-gray-500">v1.0.0</span>
  </div>

</aside>
